services:
  redis:
    image: redis:7-alpine
    container_name: s2t_rt_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    container_name: s2t_rt_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/2
      LOG_DIR: app/logs
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${API_HOST:-0.0.0.0}:${API_PORT:-8004}:8004"
    volumes:
      - ./app/logs:/app/app/logs
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8004
      2>&1 | tee /app/app/logs/log_uvicorn.log
      "

  worker:
    build: .
    container_name: s2t_rt_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/2
      LOG_DIR: app/logs
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./app/logs:/app/app/logs
    depends_on:
      - redis
    command: >
      sh -c "
      celery
      -A app.workers.celery.celery_app
      worker
      -Q audio_pipeline
      --loglevel=info
      --concurrency=${PIPELINE_WORKERS}
      2>&1 | tee /app/app/logs/log_celery.log
      "

volumes:
  redis_data:
